name: Lupin

# Claude + OpenAI review through Lupin (docs/review-criteria.md). A maintainer requests a review with
# a `/lupin review` PR comment or a manual dispatch. Automatic review on PR updates stays off until the
# `LUPIN_AUTO_REVIEW` repository variable is `true`, which is part of the coordinated cutover from
# claude.yml; while it is off, PR updates start no job and post nothing.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # Admission: decide whether this event asks for a review of the current PR revision, supersede
  # older runs and acknowledge the request. Executes only the pinned Lupin release and trusted code.
  start:
    if: |
      (
        github.event_name == 'pull_request_target' &&
        vars.LUPIN_AUTO_REVIEW == 'true' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      ) || (
        github.event_name == 'workflow_dispatch'
      ) || (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/lupin')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: lupin-comment-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      queue: max
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write # Cancel superseded review runs.
    outputs:
      admission: ${{ steps.admission.outputs.artifact-id }}
      disposition: ${{ steps.gate.outputs.disposition }}
      review: ${{ steps.gate.outputs.review }}
      pr: ${{ steps.gate.outputs.pr }}
      revision: ${{ steps.gate.outputs.revision }}
      base: ${{ steps.gate.outputs.base }}
    steps:
      # Executed code (install action, CI scripts) always comes from the default branch, never from
      # the PR or its target branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/install-lupin
        id: lupin
        with:
          app-id: ${{ secrets.LUPIN_RELEASE_APP_ID }}
          private-key: ${{ secrets.LUPIN_RELEASE_APP_PRIVATE_KEY }}
      - name: Handle review event and acknowledge request
        id: gate
        env:
          LUPIN: ${{ steps.lupin.outputs.bin }}
          GH_TOKEN: ${{ github.token }}
          LUPIN_AUTO_REVIEW: ${{ vars.LUPIN_AUTO_REVIEW || 'false' }}
          LUPIN_AUTOMATIC_LINE_LIMIT: ${{ vars.LUPIN_AUTOMATIC_LINE_LIMIT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$LUPIN" request --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            --repo "$GITHUB_REPOSITORY" --bot-login 'github-actions[bot]' --run-url "$RUN_URL" \
            --attempt "$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/review-status" \
            --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: admission
        if: always()
        with:
          name: review-start-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: ${{ runner.temp }}/review-status/
          if-no-files-found: ignore

  # Execution: read-only credentials. Proposed code is fetched as Git objects for inspection and
  # never installed or executed; reviewers run in a read-only sandbox.
  review:
    needs: start
    if: needs.start.outputs.review == 'true'
    concurrency:
      group: lupin-review-${{ needs.start.outputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # No job timeout: elapsed review time is diagnostic, not a failure. The Actions host limit applies.
    permissions:
      actions: read # Previous review artifacts.
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.result.outputs.present }}
    env:
      PR_NUMBER: ${{ needs.start.outputs.pr }}
    steps:
      - name: Describe execution host
        run: |
          echo "REVIEW_OUTPUT=$RUNNER_TEMP/review-output" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/review-output"
          echo 'Review work has no Lupin duration deadline. This Actions host has a 360-minute job limit; host interruption leaves the review incomplete.' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/install-lupin
        id: lupin
        with:
          app-id: ${{ secrets.LUPIN_RELEASE_APP_ID }}
          private-key: ${{ secrets.LUPIN_RELEASE_APP_PRIVATE_KEY }}
      - name: Load admitted request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.start.outputs.admission }}
          merge-multiple: true
          path: ${{ runner.temp }}/review-status
      - name: Prepare Linux sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor-profiles apparmor-utils
          # Load the distro's targeted profile for unprivileged sandbox namespaces.
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          # Exercise namespace creation and read-only access before spending model tokens.
          bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev -- /bin/sh -c '
            test -r "$1/package.json" || exit 1
            if touch "$1/.review-sandbox-write-probe" 2>/dev/null; then exit 1; fi
          ' sh "$GITHUB_WORKSPACE" || { echo '::error::bwrap cannot create a read-only sandbox on this runner'; exit 1; }
      - name: Fetch PR revisions
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.start.outputs.revision }}
          BASE_SHA: ${{ needs.start.outputs.base }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch origin \
            "refs/pull/$PR_NUMBER/head:refs/remotes/origin/review-pr" "$BASE_SHA" "$HEAD_SHA"
      - name: Load previous review
        id: history
        env:
          LUPIN: ${{ steps.lupin.outputs.bin }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/lupin-review.ts history
      # Lupin rejects a capture whose revisions differ from the admitted request.
      - name: Prepare exact PR input
        env:
          LUPIN: ${{ steps.lupin.outputs.bin }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.history.outputs.previous }}
        run: |
          "$LUPIN" prepare "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --profile multi-model \
            --lenses claude-review,codex-review --router vercel --source "$GITHUB_WORKSPACE" \
            --output "$REVIEW_OUTPUT/input" --admission "$RUNNER_TEMP/review-status/admission.json" \
            ${PREVIOUS:+--previous "$PREVIOUS"} 2>&1 | tee "$REVIEW_OUTPUT/prepare.log"
      - name: Run concurrent reviews and synthesis
        env:
          LUPIN: ${{ steps.lupin.outputs.bin }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          test -n "$AI_GATEWAY_API_KEY" || { echo '::error::Missing AI_GATEWAY_API_KEY repository secret'; exit 1; }
          "$LUPIN" run "$REVIEW_OUTPUT/input/prepared.json" --source "$GITHUB_WORKSPACE" \
            --output "$REVIEW_OUTPUT/run" 2>&1 | tee "$REVIEW_OUTPUT/run.log"
      - name: Expose result and summary
        id: result
        if: always()
        run: |
          node scripts/ci/lupin-review.ts result
          cat "$REVIEW_OUTPUT/run/delivery/github.md" >> "$GITHUB_STEP_SUMMARY" || echo 'Review did not produce a result. Inspect the review artifact and job logs.' >> "$GITHUB_STEP_SUMMARY"
      # Evidence for this run and the next review's history. Checkouts and runtime state stay out.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: review-${{ needs.start.outputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/review-output/
            !${{ runner.temp }}/review-output/**/checkout/**
            !${{ runner.temp }}/review-output/**/context-repositories/**
            !${{ runner.temp }}/review-output/**/workspace/**
            !${{ runner.temp }}/review-output/**/state/**

  # Publication: the only write-scoped review job. Lupin rechecks the current revisions and
  # serializes updates per PR, so an obsolete result cannot replace newer feedback.
  comment:
    needs: [start, review]
    if: always() && needs.start.outputs.disposition == 'run' && (needs.start.outputs.review == 'true' || needs.start.result == 'failure')
    concurrency:
      group: lupin-comment-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub requires contents: write for resolveReviewThread, in addition to PR write.
      contents: write
      pull-requests: write
    steps:
      - run: echo "REVIEW_OUTPUT=$RUNNER_TEMP/review-output" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/install-lupin
        id: lupin
        with:
          app-id: ${{ secrets.LUPIN_RELEASE_APP_ID }}
          private-key: ${{ secrets.LUPIN_RELEASE_APP_PRIVATE_KEY }}
      - if: needs.review.outputs.result == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-${{ needs.start.outputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-output
      - name: Publish feedback
        env:
          LUPIN: ${{ steps.lupin.outputs.bin }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.start.outputs.pr }}
          REVIEW_RESULT: ${{ needs.review.result }}
          START_RESULT: ${{ needs.start.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/lupin-review.ts publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: review-comment-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/review-output/run/comment-receipt.json
            ${{ runner.temp }}/review-output/run/comment.md
          if-no-files-found: ignore
