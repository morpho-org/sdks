name: Dependency Discovery

on:
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print bump events instead of dispatching them
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --no-warnings=ExperimentalWarning scripts/ci/dependency-discovery.ts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEVIN_DEPENDENCY_WEBHOOK_URL: ${{ secrets.DEVIN_DEPENDENCY_WEBHOOK_URL }}
          DEVIN_DEPENDENCY_WEBHOOK_SECRET: ${{ secrets.DEVIN_DEPENDENCY_WEBHOOK_SECRET }}
