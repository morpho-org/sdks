name: Test

on:
  workflow_call:
    secrets:
      MAINNET_RPC_URL:
        required: true
      BASE_RPC_URL:
        required: true
      ARBITRUM_RPC_URL:
        required: true

permissions:
  contents: read

jobs:
  unit:
    uses: ./.github/workflows/test-packages.yml
    with:
      fork: false
      packages: >-
        [
          {"name": "scripts", "projects": "scripts"},
          {"name": "agents-engine", "projects": "agents-engine"},
          {"name": "morpho-ts", "projects": "morpho-ts"},
          {"name": "morpho-test", "projects": "morpho-test"}
        ]

  fork:
    # Fork suites share the RPC endpoints; two queues bound how many runs hit them at once.
    concurrency:
      group: morpho-sdk-rpc-tests-${{ (endsWith(github.run_number, '0') || endsWith(github.run_number, '2') || endsWith(github.run_number, '4') || endsWith(github.run_number, '6') || endsWith(github.run_number, '8')) && 'even' || 'odd' }}
      queue: max
    uses: ./.github/workflows/test-packages.yml
    with:
      fork: true
      packages: >-
        [
          {"name": "blue-sdk", "projects": "blue-sdk blue-sdk-fork"},
          {"name": "midnight-sdk", "projects": "midnight-sdk midnight-sdk-fork"},
          {"name": "morpho-sdk", "projects": "morpho-sdk morpho-sdk-fork"},
          {"name": "evm-simulation", "projects": "evm-simulation evm-simulation-fork"},
          {"name": "blue-sdk-viem", "projects": "blue-sdk-viem blue-sdk-viem-fork"},
          {"name": "liquidity-sdk-viem", "projects": "liquidity-sdk-viem liquidity-sdk-viem-fork"},
          {"name": "test", "projects": "test test-fork"},
          {"name": "wdk-protocol-lending-morpho-evm", "projects": "wdk-protocol-lending-morpho-evm wdk-protocol-lending-morpho-evm-fork"}
        ]
    secrets:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}

  vitest:
    name: vitest
    if: always()
    needs:
      - unit
      - fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check shards
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          FORK_RESULT: ${{ needs.fork.result }}
        run: test "$UNIT_RESULT" = success && test "$FORK_RESULT" = success
