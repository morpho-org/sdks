name: Test

on:
  workflow_call:
    secrets:
      MAINNET_RPC_URL:
        required: true
      BASE_RPC_URL:
        required: true
      ARBITRUM_RPC_URL:
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pure and fork projects from one package share a single runner.
          - name: scripts
            projects: scripts
            uses_foundry: false
          - name: agents-engine
            projects: agents-engine
            uses_foundry: false
          - name: morpho-ts
            projects: morpho-ts
            uses_foundry: false
          - name: blue-sdk
            projects: blue-sdk blue-sdk-fork
            uses_foundry: true
          - name: midnight-sdk
            projects: midnight-sdk midnight-sdk-fork
            uses_foundry: true
          - name: morpho-sdk
            projects: morpho-sdk morpho-sdk-fork
            uses_foundry: true
          - name: evm-simulation
            projects: evm-simulation evm-simulation-fork
            uses_foundry: true
          - name: blue-sdk-viem
            projects: blue-sdk-viem blue-sdk-viem-fork
            uses_foundry: true
          - name: liquidity-sdk-viem
            projects: liquidity-sdk-viem liquidity-sdk-viem-fork
            uses_foundry: true
          - name: test
            projects: test test-fork
            uses_foundry: true
          - name: morpho-test
            projects: morpho-test
            uses_foundry: false
          - name: wdk-protocol-lending-morpho-evm
            projects: wdk-protocol-lending-morpho-evm wdk-protocol-lending-morpho-evm-fork
            uses_foundry: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Foundry cache
        id: foundry-cache
        if: matrix.uses_foundry
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-${{ github.job }}-${{ matrix.name }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            foundry-${{ github.job }}-${{ matrix.name }}-${{ github.sha }}-
            foundry-${{ github.job }}-${{ matrix.name }}-

      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        if: matrix.uses_foundry
        with:
          cache: false # Disable built-in cache to always save it.

      - run: pnpm install --frozen-lockfile

      - name: Test
        id: test
        env:
          MAINNET_RPC_URL: ${{ matrix.uses_foundry && secrets.MAINNET_RPC_URL || '' }}
          BASE_RPC_URL: ${{ matrix.uses_foundry && secrets.BASE_RPC_URL || '' }}
          ARBITRUM_RPC_URL: ${{ matrix.uses_foundry && secrets.ARBITRUM_RPC_URL || '' }}
          IS_LOGGING_DISABLED: true
          VITEST_NAME: ${{ matrix.name }}
          VITEST_PROJECTS: ${{ matrix.projects }}
        run: |
          project_args=()
          for project in $VITEST_PROJECTS; do
            project_args+=(--project "$project")
          done
          pnpm exec vitest run --coverage \
            "${project_args[@]}" \
            --reporter=default --reporter=github-actions --reporter=blob \
            --outputFile.blob="vitest-reports/$VITEST_NAME.json"

      - name: Redact RPC credentials from fork report
        id: redact_report
        if: failure() && matrix.uses_foundry && steps.test.outcome == 'failure'
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
        run: |
          node scripts/redact-vitest-reports.mjs vitest-reports \
            | tee /dev/stderr \
            | grep -q '^Sanitized '

      - name: Upload failed report
        if: >-
          failure() &&
          steps.test.outcome == 'failure' &&
          (!matrix.uses_foundry || steps.redact_report.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-failure-${{ matrix.name }}
          path: vitest-reports/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Save Foundry cache
        if: >-
          !cancelled() &&
          matrix.uses_foundry &&
          steps.test.outcome != 'skipped' &&
          steps.foundry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.foundry/cache/rpc
          key: ${{ steps.foundry-cache.outputs.cache-primary-key }}

  vitest:
    name: vitest
    if: always()
    needs:
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check shards
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: test "$PACKAGE_RESULT" = success
