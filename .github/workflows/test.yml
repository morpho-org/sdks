name: Test

on:
  workflow_call:
    secrets:
      MAINNET_RPC_URL:
        required: true
      BASE_RPC_URL:
        required: true
      ARBITRUM_RPC_URL:
        required: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - scripts
          - agents-engine
          - morpho-ts
          - blue-sdk
          - midnight-sdk
          - morpho-sdk
          - evm-simulation
          - blue-sdk-viem
          - liquidity-sdk-viem
          - test
          - morpho-test
          - wdk-protocol-lending-morpho-evm

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        env:
          VITEST_PROJECT: ${{ matrix.project }}
        run: >-
          pnpm exec vitest run --coverage
          --project "$VITEST_PROJECT"
          --reporter=default --reporter=github-actions --reporter=blob
          --outputFile.blob="vitest-reports/$VITEST_PROJECT.json"

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-unit-${{ matrix.project }}
          path: vitest-reports
          retention-days: 1

  fork:
    name: Fork (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Runner-local semaphores cannot coordinate different GitHub runners.
      max-parallel: 2
      matrix:
        project:
          - morpho-sdk-fork
          - blue-sdk-viem-fork
          - blue-sdk-fork
          - midnight-sdk-fork
          - evm-simulation-fork
          - liquidity-sdk-viem-fork
          - test-fork
          - wdk-protocol-lending-morpho-evm-fork

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Foundry cache
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-${{ github.job }}-${{ matrix.project }}-${{ github.sha }}
          restore-keys: foundry-${{ github.job }}-${{ matrix.project }}-

      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          cache: false # Disable built-in cache to always save it.

      - run: pnpm install --frozen-lockfile

      - name: Test
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          # One Anvil per runner plus two fork runners preserves the shared RPC limit.
          MORPHO_TEST_MAX_ANVIL_PROCESSES_PER_RPC: 1
          MORPHO_TEST_ANVIL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.project }}
          IS_LOGGING_DISABLED: true
          VITEST_PROJECT: ${{ matrix.project }}
        run: >-
          pnpm exec vitest run --coverage
          --project "$VITEST_PROJECT"
          --reporter=default --reporter=github-actions --reporter=blob
          --outputFile.blob="vitest-reports/$VITEST_PROJECT.json"

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-fork-${{ matrix.project }}
          path: vitest-reports
          retention-days: 1

      - name: Save Foundry cache
        # A successful retry has validated and refreshed the cache before it is saved.
        if: success()
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-${{ github.job }}-${{ matrix.project }}-${{ github.sha }}

  vitest:
    name: Vitest
    if: always()
    needs:
      - unit
      - fork
    runs-on: ubuntu-latest

    steps:
      - name: Check shards
        env:
          FORK_RESULT: ${{ needs.fork.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$FORK_RESULT" = success

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-*
          path: vitest-reports
          merge-multiple: true

      - name: Merge reports and coverage
        run: >-
          pnpm exec vitest --merge-reports=vitest-reports --coverage
          --reporter=default --reporter=github-actions
