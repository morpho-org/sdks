name: CI

# Runs on every pull request to main. Releases don't come through a pull request:
# the sync App pushes them after the same checks ran privately. It needs no secrets: fork tests that need RPC URLs already
# ran before the release reached this repository.

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    env:
      CI: true
      HUSKY: 0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check dependency release age before install
        run: node scripts/check-release-age.ts --all

      - run: bun install --frozen-lockfile

      - run: bun run build:ci

      - run: bun run lint

      - run: bun run vitest run --project '!*-fork'

      - name: Pack publishable tarballs
        run: node scripts/publish/pack.ts --out "$RUNNER_TEMP/tarballs"

      - name: Verify tarballs
        run: node scripts/publish/verify-release-set.ts "$RUNNER_TEMP/tarballs"
