name: zizmor

on:
  push:
    branches:
      - main
      - next
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest

    permissions:
      contents: read # checkout
      security-events: write # upload SARIF results to code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: 'pip install --only-binary :all: --require-hashes --requirement .github/zizmor-requirements.txt'

      - name: Run zizmor
        run: zizmor --format sarif --no-exit-codes . > zizmor.sarif
        env:
          GH_TOKEN: ${{ github.token }}

      # Fork PRs get a read-only token, so code scanning would reject the upload.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor
