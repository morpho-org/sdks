name: zizmor

on:
  push:
    branches:
      - main
      - next
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    # Required status check on `main`: keep this name stable.
    name: zizmor
    runs-on: ubuntu-latest

    permissions:
      contents: read # checkout
      actions: read # upload-sarif reads the workflow run on private repos
      security-events: write # upload SARIF results to code scanning

    env:
      # Fork and Dependabot PRs get a read-only token, so code scanning would reject the upload.
      CAN_UPLOAD: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor's online audits read the tags of every pinned action. internal-tools
      # (review.yml's Lupin workflow) is private, so github.token can't read it.
      - name: Mint internal-tools read token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LUPIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.LUPIN_APP_PRIVATE_KEY }}
          owner: morpho-org
          repositories: internal-tools
          permission-contents: read

      - name: Upload findings to code scanning
        if: env.CAN_UPLOAD == 'true'
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          token: ${{ steps.token.outputs.token }}

      # SARIF mode exits 0 on findings, so this step is what fails the check.
      - name: Fail on medium or higher findings
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          token: ${{ steps.token.outputs.token }}
          advanced-security: false
          annotations: true
          min-severity: medium
