name: Test packages

on:
  workflow_call:
    inputs:
      fork:
        description: Whether the packages run fork suites against the RPC endpoints.
        type: boolean
        required: true
      packages:
        description: JSON array of { name, projects } matrix entries.
        type: string
        required: true
    secrets:
      MAINNET_RPC_URL:
        required: false
      BASE_RPC_URL:
        required: false
      ARBITRUM_RPC_URL:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.packages) }}

    # Pure and fork projects from one package share a single runner.
    steps:
      - name: Check RPC secrets
        if: inputs.fork
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
        run: |
          for name in MAINNET_RPC_URL BASE_RPC_URL ARBITRUM_RPC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; fork suites would skip instead of failing."
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Foundry cache
        id: foundry-cache
        if: inputs.fork
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-${{ github.job }}-${{ matrix.name }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            foundry-${{ github.job }}-${{ matrix.name }}-${{ github.sha }}-
            foundry-${{ github.job }}-${{ matrix.name }}-

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        if: inputs.fork
        with:
          version: v1.8.0
          cache: false # Disable built-in cache to always save it.

      - run: pnpm install --frozen-lockfile

      - name: Test
        id: test
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          IS_LOGGING_DISABLED: true
          VITEST_PROJECTS: ${{ matrix.projects }}
          COVERAGE_ROOT: ${{ matrix.name == 'scripts' && 'scripts/{ci,release}' || format('packages/{0}/src', matrix.name) }}
        run: |
          project_args=()
          for project in $VITEST_PROJECTS; do
            project_args+=(--project "$project")
          done
          pnpm exec vitest run --coverage \
            --coverage.include="$COVERAGE_ROOT/**/*.{js,mjs,ts,tsx}" \
            "${project_args[@]}" \
            --reporter=default --reporter=github-actions

      - name: Save Foundry cache
        if: >-
          inputs.fork &&
          steps.test.outcome == 'success' &&
          steps.foundry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: ${{ steps.foundry-cache.outputs.cache-primary-key }}
