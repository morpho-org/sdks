# Detect recent npm publishes and open issues for the Devin release verifier.
name: npm release watch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'morpho-org/sdks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Watch npm releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish/watch-npm-releases.ts
