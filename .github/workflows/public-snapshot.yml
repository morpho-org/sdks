name: Public snapshot

# Builds the public tree for a release commit and runs the public gates on it.
# Only an artifact from a passing run is synced to the public repo, where
# merging triggers the npm release. Only the `sync` job holds a write token, for
# public morpho-org/sdks; it installs and runs no dependency code.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-snapshot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release commit
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.detect.outputs.released }}
    steps:
      # The later jobs only run on main, so a dispatch from another ref would
      # finish green without running the gates.
      - name: Require main for manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main: other refs skip the snapshot and the gates."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history, so a push of several commits is compared with main
          # before the push.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release/public-gates/detect-release.ts --sha "$GITHUB_SHA" --base "$BEFORE_SHA"

  # Generates and scans the tree without installing anything, so no dependency
  # code runs before the tree and its manifest are uploaded.
  snapshot:
    name: Generate and scan the public tree
    needs: detect
    if: github.ref == 'refs/heads/main' && (needs.detect.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Generate public tree
        run: node scripts/release/public-snapshot/generate.ts --sha "$GITHUB_SHA" --out "$RUNNER_TEMP/public"

      - name: Scan public tree
        run: node scripts/release/public-gates/scan.ts --tree "$RUNNER_TEMP/public/tree"

      # One tar keeps dotfiles, symlinks and modes, which artifact zips drop.
      - name: Archive public tree
        run: tar -cf "$RUNNER_TEMP/public-tree.tar" -C "$RUNNER_TEMP/public" public-tree.json tree

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-tree-${{ github.sha }}
          path: ${{ runner.temp }}/public-tree.tar
          if-no-files-found: error
          retention-days: 30

  gates:
    name: Install, build, lint, test and pack a clean copy
    needs: snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-tree-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Extract public tree
        run: mkdir "$RUNNER_TEMP/public" && tar -xf "$RUNNER_TEMP/public-tree.tar" -C "$RUNNER_TEMP/public"

      - name: Install, build, lint, test and pack a clean copy
        run: scripts/release/public-gates/clean-copy.sh "$RUNNER_TEMP/public/tree" "$RUNNER_TEMP/tarballs"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-tarballs-${{ github.sha }}
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 30

  # Checks the uploaded artifacts as the sync job will download them: the tree
  # from the job that ran no dependency code, and the tarballs from the gates.
  # The tarballs are scanned here, by a fresh checkout that installs nothing,
  # since dependency code in the gates job could change them after a scan there.
  verify:
    name: Verify artifacts
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-tree-${{ github.sha }}
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-tarballs-${{ github.sha }}
          path: ${{ runner.temp }}/public/tarballs

      - name: Verify artifact
        run: |
          tar -xf "$RUNNER_TEMP/public-tree.tar" -C "$RUNNER_TEMP/public"
          node scripts/release/public-gates/verify-artifact.ts --dir "$RUNNER_TEMP/public" --sha "$GITHUB_SHA"
          node scripts/release/public-gates/scan.ts --tarballs "$RUNNER_TEMP/public/tarballs"

  # Opens or updates the single sync PR on public morpho-org/sdks and arms its
  # squash auto-merge. Split-job boundary: a fresh full-history checkout, the
  # verified tree artifact, no install, hooks checked, then the token is minted.
  sync:
    name: Open public sync PR
    needs: [detect, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: public-sync
    concurrency:
      group: public-sync
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The ordering check needs every release commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-tree-${{ github.sha }}
          path: ${{ runner.temp }}
          digest-mismatch: error

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-tarballs-${{ github.sha }}
          path: ${{ runner.temp }}/public/tarballs
          digest-mismatch: error

      - name: Verify artifact and check for git hooks
        run: |
          tar -xf "$RUNNER_TEMP/public-tree.tar" -C "$RUNNER_TEMP/public"
          node scripts/release/public-gates/verify-artifact.ts --dir "$RUNNER_TEMP/public" --sha "$GITHUB_SHA"
          if [ -n "$(find .git/hooks -mindepth 1 ! -type d ! -name '*.sample' -print -quit)" ]; then
            echo "::error::Unexpected git hooks before minting the public sync token."
            exit 1
          fi

      - name: Mint public sync token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PUBLIC_SYNC_APP_ID }}
          private-key: ${{ secrets.PUBLIC_SYNC_APP_PRIVATE_KEY }}
          owner: morpho-org
          repositories: sdks
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release/public-sync/sync.ts --dir "$RUNNER_TEMP/public" --sha "$GITHUB_SHA" --base "$BEFORE_SHA"

  # Pages the owner when a release commit didn't reach its sync PR, including
  # when a job was cancelled, such as a sync superseded while it waited in
  # public-sync.
  alert:
    name: Alert on failed public sync
    needs: [detect, snapshot, gates, verify, sync]
    # A failed detect leaves released unset: alert, it may have been a release.
    if: always() && (failure() || contains(needs.*.result, 'cancelled')) && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.detect.result != 'success' || needs.detect.outputs.released == 'true')
    runs-on: ubuntu-latest
    environment: public-sync-alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # TBD (SDK-1371): the alert channel (its incoming webhook) and owner aren't chosen yet.
      - name: Alert
        env:
          PUBLIC_SYNC_ALERT_WEBHOOK_URL: ${{ secrets.PUBLIC_SYNC_ALERT_WEBHOOK_URL }}
          PUBLIC_SYNC_ALERT_OWNER: ${{ vars.PUBLIC_SYNC_ALERT_OWNER }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/release/public-sync/alert.ts failed
