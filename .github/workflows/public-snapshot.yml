name: Public snapshot

# Builds the public tree for a release commit and runs the public gates on it.
# Only an artifact from a passing run may be synced to the public repo, where
# merging triggers the npm release. Nothing here holds a secret or write access.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-snapshot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release commit
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.detect.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - id: detect
        run: node scripts/release/public-gates/detect-release.ts --sha "$GITHUB_SHA"

  gates:
    name: Public gates
    needs: detect
    if: needs.detect.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Generate public tree
        run: node scripts/release/public-snapshot/generate.ts --sha "$GITHUB_SHA" --out "$RUNNER_TEMP/public"

      - name: Scan public tree
        run: node scripts/release/public-gates/scan.ts --tree "$RUNNER_TEMP/public/tree"

      - name: Install, build, lint, test and pack a clean copy
        run: scripts/release/public-gates/clean-copy.sh "$RUNNER_TEMP/public/tree" "$RUNNER_TEMP/public/tarballs"

      - name: Scan tarballs
        run: node scripts/release/public-gates/scan.ts --tarballs "$RUNNER_TEMP/public/tarballs"

      - name: Verify artifact
        run: node scripts/release/public-gates/verify-artifact.ts --dir "$RUNNER_TEMP/public"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/public
          if-no-files-found: error
          retention-days: 30
