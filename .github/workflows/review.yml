name: Lupin

on: # zizmor: ignore[dangerous-triggers] -- lupin.yml checks out the base commit; PR content is only inspected in the sandbox
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read

jobs:
  lupin:
    # The ceiling for lupin.yml's jobs; each job requests only its part.
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: morpho-org/internal-tools/.github/workflows/lupin.yml@1b4582b7f8d5ead564aeec5ce89ec4a979fcab48 # workflow: @morpho-org/review-cli@0.25.2; binary: stable
    with:
      pr: ${{ inputs.pr }}
    secrets:
      LUPIN_APP_PRIVATE_KEY: ${{ secrets.LUPIN_APP_PRIVATE_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      LUPIN_LINEAR_CLIENT_SECRET: ${{ secrets.LUPIN_LINEAR_CLIENT_SECRET }}
      LUPIN_BETTERSTACK_API_TOKEN: ${{ secrets.LUPIN_BETTERSTACK_API_TOKEN }}
