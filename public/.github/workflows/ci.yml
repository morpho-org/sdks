name: CI

# Runs on every pull request to main, including the release sync PRs, and must
# pass before merge. It needs no secrets: fork tests that need RPC URLs already
# ran before the release reached this repository.

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The `ci` ruleset check matches this job name.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    env:
      CI: true
      HUSKY: 0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:ci

      - run: pnpm lint

      - run: pnpm exec vitest run --project '!*-fork'

      - name: Pack publishable tarballs
        run: node scripts/publish/pack.ts --out "$RUNNER_TEMP/tarballs"

      - name: Verify tarballs
        run: node scripts/publish/verify-release-set.ts "$RUNNER_TEMP/tarballs"
