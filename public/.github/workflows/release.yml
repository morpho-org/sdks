name: Release

# Every merge to main is a release: the repository only receives release
# snapshots. Publishing is idempotent, so a rerun only publishes, tags and
# releases what is missing.
#
#   pack     unprivileged: install, build and pack the exact bytes to publish
#   publish  npm trusted publishing (OIDC) with provenance; runs no dependency code
#   tag      package tags and GitHub Releases from the merge commit

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pack:
    name: Build & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
      HUSKY: 0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:ci

      - name: Pack publishable tarballs
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tarballs"
          mkdir -p "$out"
          # No package defines a prepack or prepare hook, so `pnpm pack` ships the
          # lib/ built above and replaces workspace: ranges with real versions.
          while IFS= read -r -d '' manifest; do
            dir="$(dirname "$manifest")"
            if [ "$(cd "$dir" && node -p "require('./package.json').private === true")" = "true" ]; then
              continue
            fi
            ( cd "$dir" && pnpm pack --pack-destination "$out" )
          done < <(find packages -mindepth 2 -maxdepth 2 -name package.json -print0)
          ( cd "$out" && sha256sum ./*.tgz | tee SHA256SUMS )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 1

  # Holds the npm OIDC token. It installs nothing and runs only Node, the npm
  # bundled with it and scripts from this commit, on tarballs whose digests and
  # identities it checks first.
  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      CI: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Require npm with trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (!(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))))) {
              console.error(`::error::npm ${process.argv[1]} < 11.5.1; trusted publishing unavailable`);
              process.exit(1);
            }
          ' "$(npm --version)"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/tarballs

      - name: Verify tarball digests
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/tarballs"
          sha256sum --check --strict SHA256SUMS

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail

          # Packages and versions declared at this commit. The pack job can't make
          # this job publish anything else.
          declare -A expected
          while IFS=$'\t' read -r pkg_name pkg_version; do
            expected["$pkg_name"]="$pkg_version"
          done < <(node -e '
            const { readdirSync, readFileSync, existsSync } = require("node:fs");
            for (const dir of readdirSync("packages")) {
              const manifest = `packages/${dir}/package.json`;
              if (!existsSync(manifest)) continue;
              const pkg = JSON.parse(readFileSync(manifest, "utf8"));
              if (pkg.private === true) continue;
              process.stdout.write(`${pkg.name}\t${pkg.version}\n`);
            }
          ')

          declare -A received_version
          declare -A received_tarball
          shopt -s nullglob
          for tgz in "${RUNNER_TEMP}/tarballs/"*.tgz; do
            entries="$(tar -tzf "$tgz" --quoting-style=escape)"
            if [ "$(printf '%s\n' "$entries" | grep -cE '(^|/)\.\.?(/|$)|//' || true)" != "0" ] ||
              [ "$(printf '%s\n' "$entries" | grep -cvE '^package(/|$)' || true)" != "0" ] ||
              [ "$(printf '%s\n' "$entries" | grep -cxE 'package/package\.json' || true)" != "1" ] ||
              [ "$(tar -tvzf "$tgz" | awk '{print substr($1, 1, 1)}' | grep -cvE '^[-d]$' || true)" != "0" ]; then
              echo "::error::Tarball ${tgz##*/} has unexpected entries; refusing to publish."
              exit 1
            fi
            node scripts/publish/verify-tarball-collisions.ts "$tgz"
            # Identity as npm publish reads it (bundled pacote).
            IFS=$'\t' read -r name version <<<"$(node scripts/publish/read-tarball-identity.ts "$tgz")"
            tmpd="$(mktemp -d)"
            tar -xzf "$tgz" -C "$tmpd" package/package.json
            manifest_identity="$(node scripts/publish/verify-tarball-manifest.ts "${tmpd}/package/package.json")"
            rm -rf "$tmpd"
            if [ "$manifest_identity" != "${name}@${version}" ]; then
              echo "::error::Tarball ${tgz##*/}: package.json says '${manifest_identity}' but npm would publish '${name}@${version}'."
              exit 1
            fi
            if [ -n "${received_version[$name]:-}" ]; then
              echo "::error::Duplicate tarball for ${name}."
              exit 1
            fi
            received_version["$name"]="$version"
            received_tarball["$name"]="$tgz"
          done

          for name in "${!expected[@]}"; do
            if [ "${received_version[$name]:-}" != "${expected[$name]}" ]; then
              echo "::error::Missing or mismatched tarball for ${name}@${expected[$name]} (got '${received_version[$name]:-<none>}')."
              exit 1
            fi
          done
          for name in "${!received_version[@]}"; do
            if [ -z "${expected[$name]:-}" ]; then
              echo "::error::Unexpected tarball ${name}@${received_version[$name]}."
              exit 1
            fi
          done

          for name in "${!received_version[@]}"; do
            version="${received_version[$name]}"
            if npm view "${name}@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Already on npm: ${name}@${version}"
              continue
            fi
            npm publish "${received_tarball[$name]}" \
              --provenance \
              --access public \
              --tag latest \
              --ignore-scripts \
              --registry https://registry.npmjs.org
          done

  tag:
    name: Tags & GitHub Releases
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Push package tags and create GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT

          tags=()
          while IFS= read -r -d '' manifest; do
            tag="$(node scripts/publish/compute-pending-tag.ts "$manifest")"
            [ -n "$tag" ] && tags+=("$tag")
          done < <(git diff --name-only -z --diff-filter=ACMRT HEAD^ HEAD -- 'packages/*/package.json')

          releases_dir="${RUNNER_TEMP}/github-releases"
          mkdir -p "$releases_dir"
          for tag in "${tags[@]}"; do
            if ! git ls-remote --exit-code --tags --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then
              git tag "$tag" -m "$tag"
              git push --no-verify origin "refs/tags/${tag}"
            fi
            body_file="${releases_dir}/${tag//\//__}.md"
            node scripts/publish/github-release-body.ts "$tag" "$body_file"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$tag" --notes-file "$body_file"
            else
              gh release create "$tag" --title "$tag" --notes-file "$body_file" --verify-tag
            fi
          done
