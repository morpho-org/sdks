packages:
  - packages/*

catalog:
  typescript: 7.0.2
  vitest: ^4.1.11

autoInstallPeers: true
linkWorkspacePackages: deep
preferWorkspacePackages: true
ignoreWorkspaceCycles: true

overrides:
  tmp: 0.2.7

allowBuilds:
  '@biomejs/biome': true
  bufferutil: true
  esbuild: true
  keccak: true
  secp256k1: true
  utf-8-validate: true

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
