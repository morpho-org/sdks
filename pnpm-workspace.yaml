packages:
  - packages/*

catalog:
  "@fast-check/vitest": ^0.5.0
  typescript: 7.0.2
  vitest: ^4.1.12
  fast-check: ^4.9.0

autoInstallPeers: true
linkWorkspacePackages: deep
preferWorkspacePackages: true
ignoreWorkspaceCycles: true

overrides:
  tmp: 0.2.7
  ws@8.21.0: 8.21.3

allowBuilds:
  '@biomejs/biome': true
  bufferutil: true
  esbuild: true
  keccak: true
  secp256k1: true
  utf-8-validate: true

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
