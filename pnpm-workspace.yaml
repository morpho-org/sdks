  "@morpho-org/liquidity-sdk-viem>@morpho-org/blue-sdk-viem": "npm:@morpho-org/blue-sdk-viem@5.5.0"
  "@morpho-org/liquidity-sdk-viem>@morpho-org/morpho-sdk": "npm:@morpho-org/morpho-sdk@5.9.0"
  "@morpho-org/liquidity-sdk-viem>@morpho-org/morpho-ts": "npm:@morpho-org/morpho-ts@2.11.1"
  "@morpho-org/morpho-sdk@5.9.0>@morpho-org/blue-sdk": "npm:@morpho-org/blue-sdk@6.7.0"
  "@morpho-org/morpho-sdk@5.9.0>@morpho-org/blue-sdk-viem": "npm:@morpho-org/blue-sdk-viem@5.5.0"
  "@morpho-org/morpho-sdk@5.9.0>@morpho-org/midnight-sdk": "npm:@morpho-org/midnight-sdk@1.3.1"
